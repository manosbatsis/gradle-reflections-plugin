plugins {
    id 'groovy'
    id 'java-library'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'io.github.manosbatsis.gradle.plugin'
version = '1.2.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

test {
    outputs.upToDateWhen { false }
    testLogging {
        exceptionFormat = 'full'
        stackTraceFilters 'entryPoint'
        showStandardStreams = true
    }
}

def createClasspathManifest = tasks.register('createClasspathManifest') {
    def outputDir = layout.buildDirectory.dir('createClasspathManifest')
    def classpathFiles = sourceSets.main.runtimeClasspath
    inputs.files(classpathFiles)
    outputs.dir(outputDir)

    doLast {
        def dir = outputDir.get().asFile
        dir.mkdirs()
        new File(dir, 'plugin-classpath.txt').text = classpathFiles.collect { it.absolutePath }.join('\n')
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()

    implementation 'com.github.Hatzen:reflections:8dc2bbd'
    implementation('org.dom4j:dom4j:2.1.3') {
        exclude group: 'pull-parser', module: 'pull-parser'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly files(createClasspathManifest)
}

gradlePlugin {
    plugins {
        reflectionsPlugin {
            id = 'io.github.manosbatsis.gradle.plugin.reflections'
            displayName = 'Gradle Reflections Plugin'
            description = 'Pre-scan and embed a Reflections metadata index file into JVM and Android artifacts.'
            implementationClass = 'io.github.manosbatsis.gradle.plugin.reflections.ReflectionsPlugin'
        }
    }
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'gradle-reflections-plugin'
            description = 'Pre-scan and embed a Reflections metadata index file into JVM and Android artifacts.'
            url = 'https://github.com/Hatzen/gradle-reflections-plugin'
            licenses {
                license {
                    name = 'The Apache Software License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                }
            }
        }
    }
}
